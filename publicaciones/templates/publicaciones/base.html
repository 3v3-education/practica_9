<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Glups{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'publicaciones/css/style.css' %}">
</head>

<body>
    <header class="site-header">
        <h1>Glups</h1>

        <nav class="site-nav" aria-label="Navegación principal">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_publicaciones' %}">
                Publicaciones
            </a>
        </nav>
    </header>

    <main class="site-main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>Creado con Django</p>
    </footer>
</body>
</html>
